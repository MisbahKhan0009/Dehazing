# The Research Gap

## Limitations of Current Echocardiography

<div class="columns">
<div>

- **Diagnostic Gold Standard**: Essential for heart failure & valve disorders.
- **The Problem**: Image quality is compromised by:
    - Acoustic impedance mismatches.
    - Patient body habitus (obesity).
    - Environmental noise and artifacts.
- **Consequence**: **10-15%** of patients are **"Difficult-to-Image"**.
    - Conventional imaging fails.
    - Traditional filtering blurs details.

</div>

# The "Difficult-to-Image" Challenge

## Why manual intervention isn't enough

- **Current Clinical Workarounds**:
    1. Repositioning the patient (physically demanding).
    2. Using alternative imaging windows (limited view).
    3. Contrast agents (invasive, costly).
- **Time Criticality**: Emergency delays are unacceptable.
- **Research Gap**: 
    - Natural image models don't account for **speckle noise**.
    - Lack of datasets with "ground truth" reference frames.

# Evaluation Structure: Triplet Data

To ensure clinical validity, we use **Triplets**:

1. **Clean Image**: Ground Truth.
2. **Noisy Image**: Input to the model.
3. **ROI (Region of Interest) Mask**:
    - Focuses evaluation on key cardiac structures (Valves, Walls).
    - Allows computation of **CNR (Contrast-to-Noise Ratio)**.

# Model 1: U-Net Architecture

## The Medical Imaging Baseline

<div class="columns">
<div>

- **Architecture**: Encoder-Decoder with Skip Connections.
- **Mechanism**:
    - **Encoder**: Captures context.
    - **Decoder**: Localization & Upsampling.
    - **Skip Connections**: Pass fine details.
- **Role**: Foundation generator for GAN/Diffusion.

</div>

# U-Net Performance

- **Strengths**: 
    - Fast inference (Real-time).
    - Good at removing global noise.
- **Weaknesses**: 
    - Produces "smooth" or blurry outputs.
    - Struggles with high-frequency texture (speckle).
- **Result**: Improvement over filtering, but lacks "crispness".

---

# Model 2: GAN

## Generative Adversarial Network

- **Generator (U-Net)**: Creates dehazed image.
- **Discriminator (PatchGAN)**: Distinguishes *Generated* vs *Real*.
- **Objective**: Min-Max Game.
    - Forces generator to create realistic textures to fool the discriminator.

---

# GAN Architecture Details

- **PatchGAN Discriminator**:
    - Classifies **N x N patches** instead of whole image.
    - Enforces high-frequency consistency (sharp edges).
- **Loss Function**:
    - $L_{GAN}$ (Adversarial) + $\lambda L_{L1}$ (Pixel-wise).
    - Balances "realism" with "accuracy".

---

# GAN Results

- **Observation**:
    - Much sharper than standard U-Net.
    - Edges of heart walls are more defined.
- **Trade-off**:
    - Can introduce artifacts if unstable.
    - Harder to converge.
- **Verdict**: Excellent for perceptual quality.

---

# Model 3: Diffusion Models

## Probabilistic Denoising

- **Concept**: Dehazing as a gradual denoising process.
- **Forward**: Add noise until pure Gaussian.
- **Reverse**: Neural Network predicts noise to remove it.
- **Our Approach**: **Conditional Diffusion**.
    - Conditioned on the "Noisy/Hazy" input image.
    - Guides random noise into a clean version.

---

# Diffusion Architecture

- **Backbone**: Modified U-Net with Attention.
- **Time Embedding**: Model knows the "timestep" (coarse vs fine details).
- **Scheduler**: Controls noise removal speed.
- **Iterations**: Requires multiple passes (1000 steps).

---

# Comparative Analysis

| Feature | U-Net | GAN | Diffusion |
| :--- | :--- | :--- | :--- |
| **Speed** | Fast | Fast | Slow |
| **Sharpness** | Low | High | Very High |
| **Stability** | Stable | Unstable | Stable |
| **Texture** | Smooth | Realistic | Highly Realistic |

# Introducing Mamba SSM

## Selective State Space Models

<div class="columns">
<div>

**The Challenge**: 
- Transformers ($O(N^2)$) are too heavy for high-res medical video.
- CNNs only see local windows.

**The Solution: Mamba**
- State Space Models (SSM).
- **Linear Scaling** $O(N)$.
- Global context + Fast inference.

</div>
<div>
    <img src="https://images.unsplash.com/photo-1639322537228-f710d846310a?auto=format&fit=crop&w=600&q=80" alt="Abstract Lines">
</div>
</div>

# Mamba Architecture: Our Implementation

## Mamba-UNet

We replaced standard convolutional bottlenecks with **Vision Mamba Layers**.

- **Structure**:
    1. **Encoder**: Conv Blocks + Mamba mixing.
    2. **Bottleneck**: Deep Mamba stacks for global geometry.
    3. **Decoder**: Reconstruction.

---

# The Selection Mechanism

## "Selective" State Spaces

Standard SSMs are rigid. Mamba introduces **Selection**:
- The model decides to **"remember"** or **"ignore"** information.
- **In Dehazing**:
    - *Ignore*: Random noise/haze.
    - *Remember*: Continuous heart structures.
- Perfect for separating signal (anatomy) from noise (haze).

---

# Mamba Results: Metrics History

## Training Dynamics (100 Epochs)

- **Convergence**: Extremely stable.
- **Efficiency**: Faster convergence than Transformers.
- **Final Validation Stats**:
    - **PSNR**: **31.82 dB** (High fidelity).
    - **SSIM**: **0.9536** (Structural match).
    - **Loss**: 0.46 $\rightarrow$ 0.033.

---

# Quantitative Superiority

## Comparison Table

| Metric | Baseline | U-Net | GAN | **Mamba (Ours)** |
| :--- | :--- | :--- | :--- | :--- |
| **PSNR** (dB) | 15.44 | ~28.5 | ~29.8 | **31.82** |
| **SSIM** | 0.45 | 0.82 | 0.89 | **0.95** |
| **Inference** | N/A | 15ms | 15ms | **18ms** |

*Mamba achieves near-GAN quality with much better stability.*

---

# Clinical Validation Metrics

Standard metrics (PSNR) aren't enough. We used:

### CNR (Contrast-to-Noise Ratio)
- **Result**: Improved from 0.12 $\rightarrow$ **0.266**.
- **Meaning**: Contrast between tissue and blood is doubled.

### gCNR (Generalized CNR)
- **Result**: **0.325**.
- **Meaning**: Validation of histogram separation.
